apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-config" .Release.Name | quote }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | quote }}
data:
  message: {{ .Values.message | quote }}
  replicas: {{ .Values.replicas | quote }}
  {{- if .Capabilities.APIVersions.Has "yar.io/v1/TestCapability" }}
  capability: enabled
  {{- end }}
